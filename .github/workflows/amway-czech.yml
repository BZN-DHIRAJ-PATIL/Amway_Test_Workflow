name: Amway Czech Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Create Runtime Folders
        run: |
          mkdir -p Amway_Czech/INPUT
          mkdir -p Amway_Czech/OUTPUT
          mkdir -p Amway_Czech/SUCCESS
          mkdir -p Amway_Czech/FAILURE
          mkdir -p Amway_Czech/CONFIRMED_DUPLICATE
          mkdir -p Amway_Czech/Temp
          mkdir -p Amway_Czech/OUTPUT_COPY
          mkdir -p Amway_Czech/CopyOfEncryptedOutput
          mkdir -p Amway_Czech/AUDIT
          mkdir -p Amway_Czech/log
          mkdir -p Mail_Czech/Log

      - name: Make Scripts Executable
        run: |
          chmod +x Mail_Czech/Run.sh
          chmod +x Amway_Czech/CRun.sh

      - name: Run Mail Utility
        run: |
          cd Mail_Czech
          ./Run.sh

      - name: Diagnose Input Folder
        if: always()
        run: |
          echo "=== Working Directory ==="
          pwd

          echo "=== Amway Czech Folder ==="
          ls -lah Amway_Czech/

          echo "=== Input Folder ==="
          if [ -d Amway_Czech/INPUT ]; then
            echo "INPUT folder exists"
            ls -lah Amway_Czech/INPUT/
          else
            echo "INPUT folder DOES NOT EXIST"
          fi

          echo "=== Files in Amway Czech ==="
          find Amway_Czech -maxdepth 3 -type f -print

      - name: Check Input Files
        if: always()
        run: |
          echo "=== Current Directory ==="
          pwd

          echo "=== All Files in Repository Workspace ==="
          find . -type f -print

          echo "=== Amway Czech Input ==="
          ls -lah Amway_Czech/INPUT/

          echo "=== Mail Czech Input ==="
          ls -lah Mail_Czech/INPUT/ 2>/dev/null || true

      # - name: Send Audit Mail
      #   uses: dawidd6/action-send-mail@v3
      #   with:
      #      server_address: smtp.gmail.com
      #      server_port: 465
      #      secure: true

      #      username: ${{ secrets.MAIL_USER }}
      #      password: ${{ secrets.MAIL_PASSWORD }}

      #      subject: Amway Czech Audit File

      #      to: testemail@byzan.com

      #      from: dhirajpatil0819@gmail.com

      #      body: |
      #          Amway Czech batch processing completed successfully.

      #          Please find attached:
      #          - Audit File

      #      attachments: |
      #          Amway_Czech/AUDIT/*
       
      - name: Debug Email Attachments
       
        if: always()
        run: |
          echo "=== SUCCESS folder ==="
          find Amway_Czech/SUCCESS -maxdepth 2 -type f -print

          echo "=== OUTPUT folder ==="
          find Amway_Czech/OUTPUT -maxdepth 2 -type f -print

          echo "=== INPUT folder ==="
          find Amway_Czech/INPUT -maxdepth 2 -type f -print
          
      
      - name: Send Input and Output Files
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Amway Czech - Input and Output Files
          to: testemail@byzan.com
          from: GitHub Workflow
          body: |
            Amway Czech batch processing completed successfully.
            Please find attached the original input file and generated output CSV.
          attachments: Amway_Czech/SUCCESS/*,Amway_Czech/FAILURE/*,Amway_Czech/OUTPUT/*


      
      - name: Commit and Push Generated Files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f Amway_Czech/INPUT/ \
                     Amway_Czech/OUTPUT/ \
                     Amway_Czech/SUCCESS/ \
                     Amway_Czech/FAILURE/ \
                     Amway_Czech/CONFIRMED_DUPLICATE/ \
                     Amway_Czech/OUTPUT_COPY/ \
                     Amway_Czech/CopyOfEncryptedOutput/ \
                     Amway_Czech/AUDIT/ \
                     Amway_Czech/log/ \
                     Mail_Czech/Log/

          if ! git diff --cached --quiet; then
            git commit -m "Store Amway Czech workflow results"
            git push
          else
            echo "No file changes to commit."
          fi



      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amway-results
          path: |
            Amway_Czech/OUTPUT/**
            Amway_Czech/SUCCESS/**
            Amway_Czech/FAILURE/**
            Amway_Czech/AUDIT/**
            Amway_Czech/log/**
